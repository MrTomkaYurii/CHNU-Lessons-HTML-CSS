<!----------------------------------------------------------------------------
  📌 ЩО ТАКЕ HTML?

  HTML — це мова розмітки (HyperText Markup Language).
  Вона НЕ є мовою програмування — вона описує СТРУКТУРУ сторінки.

  Уяви що ти будуєш будинок:
  🧱 HTML  — це цегла і стіни (структура)
  🎨 CSS   — це фарба і декор (зовнішній вигляд)
  ⚙️  JS    — це електрика та сантехніка (поведінка)

  Зараз ми вивчаємо тільки цеглу.
------------------------------------------------------------------------------->


<!----------------------------------------------------------------------------
  📌 ЩО ТАКЕ ТЕГ?

  Тег — це команда для браузера, записана у кутових дужках: < >

  Теги бувають двох видів:

  1. ПАРНІ — мають відкриваючий і закриваючий тег:
     <p>Це текст параграфу</p>
      ↑                  ↑
      відкриваючий       закриваючий (має / на початку)

  2. ОДИНОЧНІ — не мають закриваючого тегу (самодостатні):
     <br>        ← перенос рядка
     <img>       ← зображення
     <meta>      ← мета-інформація
     <link>      ← підключення зовнішнього файлу

  Структура парного тегу:
  ┌─────────────────────────────────────────────────┐
  │  <назва_тегу>  вміст тегу  </назва_тегу>        │
  │       ↑            ↑              ↑             │
  │  відкриває     що всередині    закриває         │
  └─────────────────────────────────────────────────┘
------------------------------------------------------------------------------->


<!-- --------------------------------------------------------------------------
  📌 ЩО ТАКЕ АТРИБУТ?

  Атрибути — це додаткова інформація для тегу.
  Вони пишуться ВСЕРЕДИНІ відкриваючого тегу.

  Формат: назва_атрибуту="значення"

  Приклад:
  <a href="https://google.com">Перейти на Google</a>
       ↑         ↑
  назва атрибуту  значення атрибуту (завжди в лапках)

  Ще приклад:
  <img src="photo.jpg" alt="Моє фото" width="200">
        ↑        ↑       ↑      ↑       ↑      ↑
     атрибут  значення атрибут значення атрибут значення

  Атрибутів може бути декілька — просто через пробіл.
----------------------------------------------------------------------------- -->


<!----------------------------------------------------------------------------
  📌 ЩО ТАКЕ КОМЕНТАР У HTML?

  Коментар — це текст який браузер ІГНОРУЄ.
  Він потрібен тільки для людини (розробника).
------------------------------------------------------------------------------->
  <!-- Формат коментаря: -->
  <!-- Тут пишемо будь-який текст — браузер це не покаже -->


<!----------------------------------------------------------------------------
  🔽 А ОСЬ ТУТ ПОЧИНАЄТЬСЯ РЕАЛЬНИЙ КОД СТОРІНКИ
  ↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓↓
------------------------------------------------------------------------------->


<!DOCTYPE html>
  <!-- ☝️ ЦЕЙ РЯДОК ОБОВ'ЯЗКОВИЙ! Він завжди перший.

    DOCTYPE — це НЕ тег, це оголошення (декларація).
    Він каже браузеру: "Привіт! Далі буде HTML5."
    HTML5 — це сучасна версія HTML (з 2014 року).

    Що буде якщо прибрати DOCTYPE?
    → Браузер перейде в "режим сумісності" і може показати
      сторінку з помилками або по-старому.

    Завжди пишеться ВЕЛИКИМИ літерами: DOCTYPE
    Завжди перший рядок файлу — нічого не повинно бути вище.
  -->


<html lang="uk">
  <!-- ☝️ ТЕГ <html> — КОРІНЬ УСЬОГО

    Тег <html> огортає ВСЮ сторінку.
    Він є "батьком" для всіх інших тегів.
    Всі інші теги — його "діти".

    Атрибут lang="uk":
    → Каже браузеру і пошуковикам: "Ця сторінка українською мовою"
    → lang — скорочення від "language" (мова)
    → "uk" — код української мови
    → "en" — англійська, "de" — німецька, "fr" — французька

    Навіщо lang?
    → Скрін-рідери (для людей з вадами зору) правильно вимовляють текст
    → Google краще розуміє для якої аудиторії сторінка
    → Браузер може автоматично запропонувати переклад

    Тег <html> ЗАКРИВАЄТЬСЯ в самому кінці файлу: </html>
  -->


  <head>
    <!-- ☝️ ТЕГ <head> — "ГОЛОВА" ДОКУМЕНТУ
      <head> — це місце де зберігається службова інформація про сторінку.
      Всі теги всередині <head> — НЕ відображаються на сторінці.
      Їх бачить браузер, але не бачить користувач.

      Що зазвичай пишуть у <head>:
      → <meta>   — мета-дані (кодування, viewport, опис для Google)
      → <title>  — назва вкладки браузера
      → <link>   — підключення CSS файлів (будемо у кроці 6)
      → <style>  — CSS стилі прямо в HTML (будемо у кроці 6)
      → <script> — JavaScript (не в нашому курсі)

      Аналогія: <head> — це як зворотня сторона книги,
      де написано: автор, рік видання, ISBN, мова.
      Читач це не читає, але бібліотекар — використовує.
    -->


    <meta charset="UTF-8">
    <!-- ☝️ КОДУВАННЯ СИМВОЛІВ — ДУЖЕ ВАЖЛИВИЙ ТЕГ!

      charset — скорочення від "character set" (набір символів)
      UTF-8 — це стандарт кодування який підтримує ВСІ мови світу.

      Що буде якщо прибрати цей рядок?
      → Кирилиця може відображатись як "кракозябри": ???? або ÐÑÐ
      → Це особливо важливо для української та інших мов з кирилицею

      Цей тег ЗАВЖДИ повинен бути ПЕРШИМ у <head>.
      Чому першим? Бо браузер повинен знати кодування
      ДО того як почне читати будь-який текст на сторінці.

      <meta> — це одиночний тег (без закриваючого).
    -->


    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- VIEWPORT — АДАПТИВНІСТЬ ДЛЯ МОБІЛЬНИХ

      Viewport (вьюпорт) — це видима область браузера.
      На телефоні вона вузька, на комп'ютері — широка.

      Атрибут name="viewport" — каже що це налаштування для вьюпорту.

      Атрибут content має кілька значень через кому:
      → width=device-width    — ширина сторінки = ширині пристрою
      → initial-scale=1.0    — початковий масштаб = 100% (без zoom)

      Що буде якщо прибрати цей рядок?
      → На телефоні сторінка буде крихітною, як для комп'ютера
      → Користувач змушений буде зумити пальцями

      Цей тег НЕ є обов'язковим, але без нього сайт
      виглядатиме жахливо на мобільних пристроях.
    -->


    <meta name="description" content="Резюме Олексія Коваля — Junior Front-end розробник з Києва. Досвід у HTML, CSS, JavaScript та React.">
      <!-- ОПИС СТОРІНКИ ДЛЯ ПОШУКОВИКІВ

        Цей тег НЕ відображається на сторінці.
        Але він дуже важливий для SEO (пошукова оптимізація).

        name="description" — тип мета-тегу: опис
        content="..." — сам текст опису (до 160 символів)

        Де ти бачиш цей текст?
        → У результатах Google під назвою сайту:

          Олексій Коваль — Front-end Developer  
          Резюме Олексія Коваля — Junior Front-end     
          розробник з Києва. Досвід у HTML, CSS... 


        Якщо не написати description, Google сам вибере
        будь-який текст зі сторінки — часто незручний.
      -->


    <meta name="author" content="Олексій Коваль">
      <!-- ☝️ АВТОР СТОРІНКИ

        Вказує хто є автором цього документу.
        Використовується пошуковиками та інструментами аналізу.
        Не відображається на сторінці.
      -->


    <meta name="keywords" content="резюме, front-end, HTML, CSS, JavaScript, розробник, Київ">
      <!-- ☝️ КЛЮЧОВІ СЛОВА (ЗАСТАРІЛИЙ, АЛЕ КОРИСНО ЗНАТИ)

        Колись цей тег активно використовувався для SEO.
        Зараз Google його майже ігнорує (через спам у 2000-х).
        Але деякі інші пошуковики ще звертають увагу.
        Залишаємо як приклад — він нікому не шкодить.
      -->


    <title>Резюме — Олексій Коваль | Front-end Developer</title>
      <!-- ТЕГ <title> — НАЗВА ВКЛАДКИ БРАУЗЕРА

        Це єдиний тег у <head> який щось "показує" — але не на сторінці,
        а у вкладці браузера (tab) і в результатах Google.

        Де бачиш текст з <title>:
        1. Вкладка браузера: [Резюме — Олексій Коваль | Front-end Developer]
        2. Результати Google: це перший рядок (синє посилання)
        3. При збереженні сторінки — пропонується як ім'я файлу
        4. При додаванні в закладки — пропонується як назва

        Правила гарного title:
        → Унікальний для кожної сторінки
        → До 60 символів (далі Google обрізає)
        → Містить ключові слова
        → Читабельний і зрозумілий

        title — це ПАРНИЙ тег (є відкриваючий і закриваючий)
        Це ЄДИНИЙ парний тег у <head> що видно "назовні"
      -->


  </head>
    <!-- Закриваємо <head>. Все що стосується "голови" — написано. -->


  <body>
 
    <!-- ТЕГ <body> — "ТІЛО" ДОКУМЕНТУ

    <body> — це де живе весь ВИДИМИЙ вміст сторінки.
    Все що бачить користувач — тексти, зображення, кнопки —
    все це знаходиться всередині <body>.

    Якщо <head> — це кулуари театру (глядачі не бачать),
    то <body> — це сцена (все що бачить глядач).

    Зараз <body> майже порожній — ми тільки будуємо каркас.
    З кожним кроком він буде наповнюватися.

    Важлива структура HTML документу: -->
   
     
              <!--
                  Важлива структура HTML документу:

                  DOCTYPE html
                  html
                    head
                      meta charset="UTF-8"
                      title Назва /title
                    /head   - службова інформація
                    body
                      ... весь видимий контент ...
                    /body
                  /html
              -->


    <!-- 
      ТИМЧАСОВИЙ ВМІСТ ДЛЯ ДЕМОНСТРАЦІЇ КРОКУ 1
      На наступних кроках тут буде повноцінне резюме.
      Зараз показуємо просту заглушку — щоб сторінка не була
      абсолютно порожньою і ми бачили що вона "живе".
    -->

    Привіт, браузере! Це моя перша HTML-сторінка.

    Я поки що не знаю жодних тегів для оформлення тексту —
    тому виглядаю як звичайний текст без будь-якого форматування.

    Але вже на наступному кроці тут з'явиться справжня структура!

    Мене звати Олексій Коваль.
    Я вчусь будувати сайти з нуля.

    <!-- 💡 ЗВЕРНИ УВАГУ:
      Весь цей текст написаний без жодних тегів — просто рядки.
      Браузер показує його як один суцільний блок,
      ігноруючи переноси рядків і пробіли.

      Спробуй:
      → Додай 100 пробілів між словами — браузер покаже 1 пробіл
      → Натисни Enter 10 разів між словами — браузер ігнорує це

      Чому? Бо HTML використовує ТЕГИ для форматування,
      а не пробіли та переноси рядків.
      Для переносу рядка є тег <br> — вивчимо на кроці 2!
    -->


  </body>
  <!-- ☝️ Закриваємо <body>. -->


</html>

  │  <html lang="uk">     ← корінь, мова сторінки          │

  Що ти вивчив:
  ✅ HTML — мова розмітки (структура, не програмування)
  ✅ Тег — команда в кутових дужках < >
  ✅ Парні теги: <тег>вміст</тег>
  ✅ Одиночні теги: <meta>, <br>, <img>
  ✅ Атрибут — додаткова інформація в тезі: name="value"

  ✅ <head> — службова інформація (не видно юзеру)
  ✅ <meta charset="UTF-8"> — кодування, завжди першим
  ✅ <meta viewport> — адаптивність для мобільних
  ✅ <meta description> — опис для пошуковиків
  ✅ <title> — назва вкладки браузера
  ✅ <body> — весь видимий контент сторінки

  ➡️  Наступний крок: Крок 2 — Текст і заголовки
      Додаємо ім'я, посаду, опис — і дізнаємось про

 -->
